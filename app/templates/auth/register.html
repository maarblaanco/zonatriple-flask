{% extends "layout.html" %}
{% block content %}

<link rel="stylesheet" href="/stylesheets/equipos.css">

<section class="seccion">
  <h1 class="seccion-titulo">Registro</h1>

  <form class="formulario" action="/auth/register" method="POST">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" required>

    <label for="email">Email</label>
    <input id="email" type="email" name="email" required>

    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>

    <button class="boton boton-principal" type="submit">Crear cuenta</button>
    <a class="boton boton-secundario" href="/auth/login">Volver al login</a>
  </form>
</section>

{% endblock %}
