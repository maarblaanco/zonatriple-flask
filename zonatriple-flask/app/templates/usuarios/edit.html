{% extends "layout.html" %}
{% block content %}

<link rel="stylesheet" href="/stylesheets/equipos.css">

<div class="usuarios">

<section class="seccion">
  <h1 class="seccion-titulo">Editar usuario</h1>
  <p class="texto">Modifica los datos del usuario.</p>

  <form class="formulario" method="POST" action="/usuarios/{{ usuario.id }}">
    <input type="hidden" name="_method" value="PUT">

    <label for="username">Username</label>
    <input id="username" type="text" name="username" value="{{ usuario.username }}" required>

    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ usuario.email }}" required>

    <label for="password">Password (dejar vacío para mantener la actual)</label>
    <input id="password" type="password" name="password" value="">

    <label for="role">Role</label>
    <select id="role" name="role" required>
      <option value="user" {% if usuario.role == "user" %}selected{% endif %}>user</option>
      <option value="admin" {% if usuario.role == "admin" %}selected{% endif %}>admin</option>
    </select>

    <button class="boton boton-principal" type="submit">
      Guardar cambios
    </button>
  </form>

  <div class="acciones">
    <a class="boton boton-secundario" href="/usuarios">
      Cancelar
    </a>
  </div>

</section>

</div>

{% endblock %}
